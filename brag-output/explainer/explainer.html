#scan{position:absolute;height:4px;margin-top:-2px;background:linear-gradient(90deg,transparent,#a5bbff 15%,#fff 50%,#a5bbff 85%,transparent);z-index:6}

#card{position:absolute;left:0;top:0;text-align:center}
#flood{position:absolute;left:0;top:0;background:#3D4FE0;transform-origin:50% 50%}

for (const s of SCRIPT) {

const pool = {};
function img(src) { if (!pool[src]) { const i = new Image(); i.src = src; pool[src] = i; } return pool[src]; }
const preload = [];
['w-home','w-tall','w-q2','w-q5','w-shoes','w-detail','w-detail-worn','t-base','t-bg','t-lock','t-extras','t-style','t-nope','o-board','o-board-sel','o-board-moved','o-board-colour','o-grid','o-sheet','p-agenda','p-month','p-auto','p-before','p-worn','l-home','l-cap','l-trip','l-trip2','l-wish','i-top','i-tall','s-top','s-tall','s-dark','s-rose','w-dark-rose','t-dark-rose','a-sheet','a-guide2','a-cut-00','a-cut-done','a-zoom','a-restore','a-form1','a-form1b','a-form2','a-form3','a-saved'].forEach((n) => preload.push(img(IMG(n))));

ITEMS.forEach((n) => preload.push(img(`items/${n}.png`)));

// a state renders into a layer element as HTML (cached by key)
function stateHTML(st, b, lt) {
  if (st.img) return `<img class="full" src="${IMG(st.img)}">`;
  if (st.scroll === 'w') {
    const k = eIO(P(lt, st.t0, st.t1)), off = lerp(st.from, st.to, k), tw = R.tall['w-tall'];
    const top = tw.headerBottom, bot = tw.navTop;
    return `<img class="full" src="${IMG('w-home')}"><div style="position:absolute;left:0;top:${top}px;width:390px;height:${bot - top}px;overflow:hidden;background:#eceef2">
      <img src="${IMG('w-tall')}" style="position:absolute;left:0;top:${-top - off}px;width:390px"></div>`;
  }
  if (st.sscroll) {
    const base = st.sscroll === 'i' ? 'i-top' : 's-top', tall = st.sscroll === 'i' ? 'i-tall' : 's-tall', ti = R.tall[tall];
    const k = eIO(P(lt, st.t0, st.t1)), off = lerp(st.from, st.to, k), head = ti.baseTop + 58;
    return `<img class="full" src="${IMG(base)}"><div style="position:absolute;left:0;top:${head}px;width:390px;height:${844 - head}px;overflow:hidden;background:#fff">
      <img src="${IMG(tall)}" style="position:absolute;left:0;top:${-(ti.tallTop + 58) - off}px;width:390px"></div>`;
  }
  if (st.tryon) {
    const pos = tryPos(b, lt);
    let h = `<img class="full" src="${IMG('t-bg')}">`;
    ROWS.forEach((r, i) => {
      const p = pos[i], i0 = Math.floor(p), fr = p - i0, n = r.n, m = (v) => ((v % n) + n) % n;
      const blur = pos.v && pos.v[i] > 6 ? `filter:blur(${Math.min(3, (pos.v[i] - 6) * 0.12)}px);` : '';
      h += `<div class="row" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;${blur}">
        <img src="${STRIPS[i][m(i0)]}" style="left:${-fr * r.w}px;width:${r.w}px"><img src="${STRIPS[i][m(i0 + 1)]}" style="left:${(1 - fr) * r.w}px;width:${r.w}px"></div>
        <div class="tmeta" style="left:${r.x + 12}px;top:${r.y}px">${['Top', 'Bottom', 'Shoes'][i]}<span class="cnt">${m(Math.round(p)) + 1}/${n}</span></div>`;
    });

  return '';
}
// Try on row positions over a beat (continuous indexes)

function tryPos(b, lt) {
  const pos = [...(START_POS[b.id] || [0, 0, 0])];
  for (const tp of ((B[b.id] || {}).taps || [])) if (tp.kind === 'swipe') { const k = eIO(P(lt, tp.t, tp.t + 0.45)); if (lt >= tp.t) pos[tp.row] = lerp(tp.from, tp.to, k); }
  const vel = [0, 0, 0];
  if ((B[b.id] || {}).shuffle) { const [a, z] = (B[b.id] || {}).shuffle; const k = P(lt, a, z), e = 1 - Math.pow(1 - k, 2.4);
    pos[1] = lerp(1, 0 + 2 * 3, e); pos[2] = lerp(2, 0 + 4 * 3, e); if (k > 0 && k < 1) { vel[1] = vel[2] = (1 - k) * 40; } }
  if ((B[b.id] || {}).style) { const [a, z] = (B[b.id] || {}).style; const land = [z - 0.9, z - 0.45, z], fin = (R.styled || []).map((x) => parseInt(x) - 1), tgt = [fin[0] + 2 * 4, fin[1] + 2 * 4, fin[2] + 4 * 3];
    for (let i = 0; i < 3; i++) { const k = P(lt, a, land[i]), e = 1 - Math.pow(1 - k, 2.6); pos[i] = lerp(0, tgt[i], e); if (k > 0 && k < 1) vel[i] = (1 - k) * 45; } }
  pos.v = vel; return pos;
}

function renderScreen(b, lt) {
  const sts = (B[b.id] || {}).states || [{ t: 0, img: 'w-home' }];
  let i = 0; for (let j = 0; j < sts.length; j++) if (lt >= sts[j].t) i = j;
  const cur = sts[i], prev = sts[i - 1];
  const d = cur.d ?? (cur.tr === 'sheet' || cur.tr === 'sheetdown' ? 0.42 : cur.tr === 'push' ? 0.38 : 0.3);
  const k = cur.tr && prev ? P(lt, cur.t, cur.t + d) : 1;
  const A = $('#LA'), Bl = $('#LB');
  A.innerHTML = prev && k < 1 ? stateHTML(prev, b, lt) : stateHTML(cur, b, lt);
  Bl.innerHTML = prev && k < 1 ? stateHTML(cur, b, lt) : '';

  if (cur.tr === 'scroll') { set(A, { transform: `translateY(${-300 * e}px)`, opacity: 1 - e }); set(Bl, { transform: `translateY(${300 * (1 - e)}px)`, opacity: e }); }
  if (cur.tr === 'sheet') { const top = sheetTop(cur.img); set(A, { filter: `brightness(${1 - 0.45 * eo})` }); set(Bl, { clipPath: `inset(${top}px 0 0 0 round 28px 28px 0 0)`, transform: `translateY(${(844 - top) * (1 - eo)}px)` }); }
  if (cur.tr === 'sheetdown') { const top = sheetTop(prev.img); A.innerHTML = stateHTML(cur, b, lt); Bl.innerHTML = stateHTML(prev, b, lt);
    set(A, { filter: `brightness(${0.55 + 0.45 * eo})` }); set(Bl, { clipPath: `inset(${top}px 0 0 0 round 28px 28px 0 0)`, transform: `translateY(${(844 - top) * eIn(k)}px)` }); }
  if (cur.tr === 'wipe') { const r = rectOf(cur.rect); const y = r.y + r.h * e; set(Bl, { clipPath: `inset(0 0 ${844 - y}px 0)` });
    set($('#scan'), { opacity: 1, left: r.x + 'px', width: r.w + 'px', top: y + 'px' }); }
}

// ---------------- finger ----------------
function fingerAt(b, lt) {
  const taps = ((B[b.id] || {}).taps || []).map((tp) => {
    if (tp.kind === 'swipe') { const r = ROWS[tp.row], y = r.y + r.h * 0.55; const fw = tp.to > tp.from; return { t: tp.t, at: [fw ? 320 : 70, y], to: [fw ? 70 : 320, y], d: 0.45 }; }
    return { ...tp, at: center(tp.at) };
  });
  if (!taps.length) return null;
  let i = -1; for (let j = 0; j < taps.length; j++) if (lt >= taps[j].t - 0.5) i = j;
  if (i < 0) return null;
  const tp = taps[i], prv = taps[i - 1], nxt = taps[i + 1];
  const start = prv && tp.t - (prv.t + (prv.d || 0)) < 1.4 ? (prv.to || prv.at) : [tp.at[0] + 70, tp.at[1] + 160];
  const enterOp = prv && tp.t - (prv.t + (prv.d || 0)) < 1.4 ? 1 : P(lt, tp.t - 0.5, tp.t - 0.3);
  const endT = tp.t + (tp.d || 0);
  const leaving = !nxt || nxt.t - endT >= 1.4;
  let x, y;
  if (lt < tp.t) { const k = eOut(P(lt, tp.t - 0.5, tp.t - 0.05)); x = lerp(start[0], tp.at[0], k); y = lerp(start[1], tp.at[1], k); }
  else if (tp.to && lt < endT) { const k = eIO(P(lt, tp.t, endT)); x = lerp(tp.at[0], tp.to[0], k); y = lerp(tp.at[1], tp.to[1], k); }
  else { x = (tp.to || tp.at)[0]; y = (tp.to || tp.at)[1]; }
  const op = enterOp * (leaving ? 1 - P(lt, endT + 0.35, endT + 0.6) : 1);
  const press = tp.to ? (lt >= tp.t && lt < endT ? 0.6 : 0) : P(lt, tp.t - 0.06, tp.t) * (1 - P(lt, tp.t + 0.06, tp.t + 0.16));
  const rip = tp.to ? 0 : P(lt, tp.t, tp.t + 0.4);
  return { x, y, op, press, rip };
}

// ---------------- camera ----------------
function camAt(b, lt) {
  const z = (B[b.id] || {}).zoom; if (!z) return { z: 1, f: [195, 422] };
  let i = 0; for (let j = 0; j < z.length; j++) if (lt >= z[j][0]) i = j;
  const a = z[i], c = z[i + 1] || a;
  const k = c === a ? 0 : eIO(P(lt, a[0], c[0]));
  const fa = a.length > 2 ? [a[2], a[3]] : [195, 422], fc = c.length > 2 ? [c[2], c[3]] : [195, 422];
  return { z: lerp(a[1], c[1], k), f: [lerp(fa[0], fc[0], k), lerp(fa[1], fc[1], k)] };
}

// ---------------- text ----------------
const VOICES = ['rise', 'blur', 'build'];
function textIn(el, t, a, z, voice, dy = 40) {
  const i = eOut(P(t, a, a + 0.45)), o = eIn(P(t, z - 0.3, z));
  if (voice === 'blur') set(el, { opacity: i * (1 - o), filter: `blur(${(1 - i) * 14 + o * 8}px)`, transform: `translateY(${-o * 16}px)` });
  else if (voice === 'build') set(el, { opacity: i * (1 - o), filter: 'none', transform: `translateY(${(1 - i) * dy}px) scale(${0.96 + 0.04 * i})`, letterSpacing: `${-0.035 + 0.02 * (1 - i)}em` });
  else set(el, { opacity: i * (1 - o), filter: 'none', transform: `translateY(${(1 - i) * dy - o * 20}px)` });
}

// ---------------- the frame ----------------
function beatAt(t) { let b = T[0]; for (const x of T) if (t >= x.start) b = x; return b; }
window.render = function (t) {
  set($('#b1'), { left: (SW * 0.55 + Math.sin(t * 0.21) * 160) + 'px', top: (-260 + Math.cos(t * 0.17) * 90) + 'px' });
  set($('#b2'), { left: (-260 + Math.cos(t * 0.19) * 140) + 'px', top: (SH * 0.45 + Math.sin(t * 0.23) * 100) + 'px' });
  const b = beatAt(t), lt = t - b.start, spec = B[b.id] || {};
  const nb = T[T.indexOf(b) + 1], pb = T[T.indexOf(b) - 1];
  // reset
  ['#title', '#card', '#cap', '#flood', '#lock', '#cuts'].forEach((s) => ($(s).style.opacity = 0));
  // ---- phone placement: exits into a chapter card, returns after it ----
  let [cx, cy] = L.pc, ps = L.ps, pop = 1, pyOff = 0, pblur = 0;
  if (b.card) { pop = 0; }
  if (nb && nb.card && lt > b.dur - 0.55) { const k = eIn(P(lt, b.dur - 0.55, b.dur)); pyOff = k * SH * 0.55; pblur = k * 10; }
  if (pb && pb.card && lt < 0.7) { const k = eOut(P(lt, 0, 0.7)); pyOff = (1 - k) * SH * 0.55; pblur = (1 - k) * 10; }
  if (b.id === 'c0') { const k = eOut(P(lt, b.dur - 2.6, b.dur - 1.6)); pop = P(lt, b.dur - 2.6, b.dur - 2.4); pyOff = (1 - k) * SH * 0.6; }
  if (b.id === 'end') pop = 0;
  // ---- camera ----
  const cam = camAt(b, lt), S = ps * cam.z;
  const ax = lerp(210, 15 + cam.f[0], cam.z > 1 ? cl((cam.z - 1) / 0.35) : 0), ay = lerp(437, 15 + cam.f[1], cam.z > 1 ? cl((cam.z - 1) / 0.35) : 0);
  if (!V) { const left = cx - ax * S, lim = L.cap.x + L.cap.w + 50; if (left < lim) cx += lim - left; }
  if (V && (B[b.id] || {}).cap) { const top = cy - ay * S, lim = L.cap.y + 300; if (top < lim) cy += lim - top; }
  set($('#phone'), { opacity: pop, transform: `translate(${cx - ax * S}px,${cy - ay * S + pyOff}px) scale(${S})`, filter: pblur > 0.3 ? `blur(${pblur}px)` : 'none' });
  if (pop > 0) {
    renderScreen(b, lt);
    const lk = spec.lock; const lo = $('#lockov');
    if (lk && lt >= lk[0]) { const r = R['t-base'].lockTop; set(lo, { opacity: 1, left: r.x + 'px', top: r.y + 'px' }); } else lo.style.opacity = 0;
    const f = fingerAt(b, lt);
    if (f) { set($('#finger'), { opacity: f.op, transform: `translate(${f.x}px,${f.y}px) scale(${1 - 0.18 * f.press})` });
             set($('#ripple'), { opacity: f.rip > 0 && f.rip < 1 ? (1 - f.rip) * f.op : 0, transform: `translate(${f.x}px,${f.y}px) scale(${1 + f.rip * 1.6})` }); }
    else { $('#finger').style.opacity = 0; $('#ripple').style.opacity = 0; }
  }
  // ---- caption ----
  if (spec.cap) {
    const c = $('#cap'), ct = $('#capt'); const big = spec.claim ? 1.25 : 1;
    if (ct.dataset.k !== b.id) { ct.innerHTML = spec.cap; ct.dataset.k = b.id; }
    set(ct, { fontSize: L.cap.size * big + 'px', textAlign: L.cap.align });
    set(c, { left: L.cap.x + 'px', width: L.cap.w + 'px', top: V ? L.cap.y + 'px' : '0', height: V ? 'auto' : SH + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'center' });
    const voice = VOICES[T.filter((x) => B[x.id] && B[x.id].cap).indexOf(b) % 3];
    const out = nb && nb.card ? b.dur - 0.45 : nb && nb.id === 'end' ? b.dur : b.dur + 0.3;
    textIn(c, lt, 0.25, out, voice); if (lt > b.dur - 0.01 && !(nb && nb.card)) c.style.opacity = 0;
  }
  // ---- chapter card ----
  if (b.card) {
    const c = $('#card'); $('#cardn').textContent = `Chapter ${b.ch}`; $('#cardt').innerHTML = b.card;
    set($('#cardt'), { fontSize: L.card.size * (b.card.length > 18 ? (V ? 0.62 : 0.72) : 1) + 'px', marginTop: '22px' });
    set(c, { width: SW + 'px', height: SH + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '0 60px' });
    const i = eOut(P(lt, 0.15, 0.75)), o = eIn(P(lt, b.dur - 0.45, b.dur));
    set(c, { opacity: i * (1 - o), transform: `scale(${1.06 - 0.06 * i + 0.02 * lt / b.dur})`, filter: `blur(${(1 - i) * 16 + o * 12}px)` });
  }
  // ---- intro: the blue flood collapses, the real cutouts land in a grid, the title, then they fly into the phone ----
  if (b.id === 'c0') {
    const fk = eIO(P(lt, 0, 0.7));
    set($('#flood'), { opacity: 1 - P(lt, 0.6, 0.75), transform: `scale(${1 - 0.45 * fk},${1 - 0.98 * fk})`, borderRadius: fk * 40 + 'px' });
    const tt = $('#title'); tt.innerHTML = 'Every feature,<br>step by step.';
    set(tt, { left: '0', width: SW + 'px', top: (V ? SH * 0.40 : SH * 0.5 - L.tsize) + 'px', fontSize: L.tsize + 'px' });
    textIn(tt, lt, 0.6, b.dur - 2.6, 'build', 50);
    const cuts = $('#cuts'); cuts.style.opacity = 1;
    if (!cuts.childElementCount) ITEMS.forEach((n) => { const im = document.createElement('img'); im.src = `items/${n}.png`; im.className = 'cut'; cuts.appendChild(im); });
    const cols = V ? 4 : 7, cw = V ? 230 : 230, ch = V ? 230 : 200;
    [...cuts.children].forEach((im, j) => {
      const col = j % cols, row = Math.floor(j / cols), rowsN = Math.ceil(ITEMS.length / cols);
      let gx = (SW - cols * cw) / 2 + col * cw + cw / 2, gy;
      if (V) gy = row < 2 ? 260 + row * ch : SH * 0.40 + 2 * L.tsize + 130 + (row - 2) * ch; else gy = row === 0 ? 150 : SH - 150;
      const land = 0.7 + j * 0.12, k = eOut(P(lt, land, land + 0.5));
      const fly = eIO(P(lt, b.dur - 2.4 + j * 0.03, b.dur - 1.7 + j * 0.03));
      const tx = lerp(gx, L.pc[0], fly), ty = lerp(gy - (1 - k) * 260, L.pc[1], fly);
      const w = im.naturalWidth ? Math.min(ch * 0.9 * im.naturalWidth / im.naturalHeight, cw * 0.85) : 150;
      set(im, { width: w + 'px', opacity: k * (1 - P(fly, 0.7, 1)), transform: `translate(${tx - w / 2}px,${ty - ch * 0.4}px) rotate(${(1 - k) * (j % 2 ? 12 : -12)}deg) scale(${1 - 0.8 * fly})` });
    });
  }
  // ---- the end card: the blue bar floods from the centre, the mark and name rise, the fact follows, a slow creep ----
  if (b.id === 'end') {
    const fk = eIO(P(lt, 0, 0.5));
    set($('#flood'), { opacity: 1, transform: `scale(${0.55 + 0.45 * fk},${0.02 + 0.98 * fk})`, borderRadius: (1 - fk) * 40 + 'px' });
    const lk = $('#lock'); set(lk, { opacity: 1, width: SW + 'px', height: SH + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', gap: V ? '60px' : '44px',
      transform: `scale(${1 + 0.012 * Math.max(0, lt - 0.4)})` });
    const sz = V ? 190 : 210; set($('#mark'), { width: sz * 0.78 + 'px', height: sz * 0.78 + 'px' }); set($('#lname'), { fontSize: sz + 'px' }); set($('#lfact'), { fontSize: (V ? 54 : 56) + 'px' });
    const a = eOut(P(lt, 0.4, 0.9)), c = eOut(P(lt, 0.85, 1.3));
    set($('#lockrow'), { opacity: a, transform: `translateY(${(1 - a) * 50}px)` }); set($('#lfact'), { opacity: c, transform: `translateY(${(1 - c) * 30}px)` });
  }
  // cuts in the previous end-of-cold-open: none
};
window.ready = (async () => {
  await document.fonts.load('800 100px "Bricolage Grotesque"'); await document.fonts.load('600 100px "Bricolage Grotesque"');
  await document.fonts.load('500 40px "DM Sans"'); await document.fonts.load('600 11px "DM Sans"'); await document.fonts.ready;
  await Promise.all(preload.map((i) => (i.complete && i.naturalWidth ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
  await Promise.all(preload.map((i) => (i.decode ? i.decode().catch(() => 0) : 0)));
  return true;
})();
